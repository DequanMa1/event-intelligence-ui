name: Apply staged release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply staged release
        shell: bash
        run: |
          set -euo pipefail
          unzip -q release-patch.zip -d .release-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index .release-patch/0001-Expand-company-profile-stock-analysis.patch
          git rm -f release-patch.zip .github/workflows/apply-release-patch.yml
          rm -rf .release-patch
          git commit -m "Expand company-profile stock analysis"
          git push origin HEAD:main
